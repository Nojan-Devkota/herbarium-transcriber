[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "herbarium-transcriber"
version = "0.1.0"
description = "Herbarium sheet photo -> verified Darwin Core record, using SAM 3.1 and Muse Spark"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "openai>=1.60",
    "httpx>=0.27",
    "pillow>=10.4",
    "rapidfuzz>=3.9",
    "pycountry>=24.6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
